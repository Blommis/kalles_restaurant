{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <h1 class="mb-4 text-center">{% trans "Reset your password" %}</h1>
  <p class="text-muted text-center">
    {% trans "Enter your email address and we’ll send you a link to reset your password." %}
  </p>
  <form method="post" action="{% url 'account_reset_password' %}">
    {% csrf_token %}
    <div class="mb-3">
      <label for="{{ form.email.id_for_label }}" class="form-label">
    {{ form.email.label }}
  </label>
       <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}" 
       class="form-control" placeholder="Enter your email" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      {% trans "Send reset link" %}
    </button>
  </form>
</div>
{% endblock %}
