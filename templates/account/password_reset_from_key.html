{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <h1 class="mb-4 text-center">{% trans "Choose a new password" %}</h1>
  {% if token_fail %}
    <p class="text-danger text-center">{% trans "This password reset link is invalid or has expired." %}</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">
        {% trans "Set new password" %}
      </button>
    </form>
  {% endif %}
</div>
{% endblock %}
